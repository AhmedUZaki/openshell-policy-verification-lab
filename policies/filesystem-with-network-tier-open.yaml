      - { path: /sandbox/.uv/python/**/python* }
      - { path: /sandbox/.local/bin/pip* }

  huggingface:
    name: huggingface
    endpoints:
      - host: huggingface.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          # Download-only. POST /** used to be allowed here, which let
          # any sandboxed agent that happened to find an HF token in
          # the environment publish models, datasets, and create
          # repositories on the Hub via /api/repos/create and friends.
          # Inference traffic flows through router.huggingface.co
          # (declared below), not huggingface.co, so the POST rule
          # was never required for read-only `from_pretrained` use.
          # See #1432.
          - allow: { method: GET, path: "/**" }
      - host: cdn-lfs.huggingface.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: router.huggingface.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/python3 }
      - { path: /usr/local/bin/node }

  brew:
    name: brew
    endpoints:
      - host: formulae.brew.sh
        port: 443
        access: full
        tls: skip
      - host: github.com
        port: 443
        access: full
        # Keep GitHub and raw-content routes on automatic TLS handling so this
        # preset composes with the agent baselines and narrower inspected
        # routes under OpenShell 0.0.99. System git is excluded below; the
        # remaining curl/Homebrew clients trust the sandbox CA.
      - host: ghcr.io
        port: 443
        access: full
        tls: skip
      - host: pkg-containers.githubusercontent.com
        port: 443
        access: full
        tls: skip
      - host: objects.githubusercontent.com
        port: 443
        access: full
        tls: skip
      - host: raw.githubusercontent.com
        port: 443
        access: full
        # See the automatic-TLS compatibility rationale on github.com above.
    # System git is intentionally excluded; git-based Homebrew operations require the github preset.
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/brew }
      - { path: /home/linuxbrew/.linuxbrew/bin/brew }
      - { path: /home/linuxbrew/.linuxbrew/bin/* }
      - { path: /home/linuxbrew/.linuxbrew/Homebrew/bin/* }

