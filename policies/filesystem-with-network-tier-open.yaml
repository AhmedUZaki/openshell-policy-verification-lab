version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /var/log
    - /opt/claims-fixtures/readonly
  read_write:
    - /tmp
    - /dev/null
    - /dev/pts
    - /work

landlock:
  compatibility: hard_requirement

process:
  run_as_user: "1500"
  run_as_group: "1500"

network_policies:

  npm_yarn:
    name: npm_yarn
    endpoints:
      # L4 CONNECT tunnel. Node 22 undici issues HTTP CONNECT through
      # HTTPS_PROXY for TLS tunneling; L7 REST-mode method inspection
      # rejects CONNECT and causes ECONNRESET on tarball downloads
      # (see #2767). L4 pass-through restores undici compatibility.
      - host: registry.npmjs.org
        port: 443
        access: full
        tls: skip
      - host: registry.yarnpkg.com
        port: 443
        access: full
        tls: skip
    binaries:
      - { path: /usr/local/bin/npm* }
      - { path: /usr/local/bin/npx* }
      - { path: /usr/local/bin/node* }
      - { path: /usr/local/bin/yarn* }
      - { path: /usr/bin/npm* }
      - { path: /usr/bin/node* }

  pypi:
    name: pypi
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
