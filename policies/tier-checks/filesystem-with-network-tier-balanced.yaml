version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /var/log
    - /opt/claims-fixtures/readonly
  read_write:
    - /tmp
    - /dev/null
    - /dev/pts
    - /work

landlock:
  compatibility: hard_requirement

process:
  run_as_user: "1500"
  run_as_group: "1500"

network_policies:

  npm_yarn:
    name: npm_yarn
    endpoints:
      # L4 CONNECT tunnel. Node 22 undici issues HTTP CONNECT through
      # HTTPS_PROXY for TLS tunneling; L7 REST-mode method inspection
      # rejects CONNECT and causes ECONNRESET on tarball downloads
      # (see #2767). L4 pass-through restores undici compatibility.
      - host: registry.npmjs.org
        port: 443
        access: full
        tls: skip
      - host: registry.yarnpkg.com
        port: 443
        access: full
        tls: skip
    binaries:
      - { path: /usr/local/bin/npm* }
      - { path: /usr/local/bin/npx* }
      - { path: /usr/local/bin/node* }
      - { path: /usr/local/bin/yarn* }
      - { path: /usr/bin/npm* }
      - { path: /usr/bin/node* }

  pypi:
    name: pypi
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3* }
      - { path: /usr/bin/pip* }
      - { path: /usr/local/bin/curl }
      - { path: /usr/local/bin/python3* }
      - { path: /usr/local/bin/pip* }
      - { path: /usr/local/bin/uv }
      - { path: /sandbox/.venv/bin/python* }
      - { path: /sandbox/.venv/bin/pip* }
      - { path: /sandbox/.uv/python/**/python* }
      - { path: /sandbox/.local/bin/pip* }

  huggingface:
    name: huggingface
    endpoints:
      - host: huggingface.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          # Download-only. POST /** used to be allowed here, which let
          # any sandboxed agent that happened to find an HF token in
          # the environment publish models, datasets, and create
          # repositories on the Hub via /api/repos/create and friends.
          # Inference traffic flows through router.huggingface.co
          # (declared below), not huggingface.co, so the POST rule
          # was never required for read-only `from_pretrained` use.
          # See #1432.
          - allow: { method: GET, path: "/**" }
      - host: cdn-lfs.huggingface.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: router.huggingface.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/python3 }
      - { path: /usr/local/bin/node }

  brew-balanced:
    name: brew-balanced
    endpoints:
      - host: formulae.brew.sh
        port: 443
        access: full
        tls: skip
      - host: github.com
        port: 443
        access: full
        # Keep github.com on automatic TLS handling so this preset composes
        # with the agent baselines and narrower inspected routes under
        # OpenShell 0.0.99. System git is excluded below; the
        # remaining curl/Homebrew clients trust the sandbox CA.
      - host: ghcr.io
        port: 443
        access: full
        tls: skip
      - host: pkg-containers.githubusercontent.com
        port: 443
        access: full
        tls: skip
      - host: objects.githubusercontent.com
        port: 443
        access: full
        tls: skip
      - host: raw.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
    # System git is intentionally excluded; git-based Homebrew operations require the github preset.
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/brew }
      - { path: /home/linuxbrew/.linuxbrew/bin/brew }
      - { path: /home/linuxbrew/.linuxbrew/bin/* }
      - { path: /home/linuxbrew/.linuxbrew/Homebrew/bin/* }

  brave:
    name: brave
    endpoints:
      - host: api.search.brave.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }
