version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    - /dev/pts
    - /work
    - /opt/claims-fixtures

landlock:
  compatibility: hard_requirement

process:
  run_as_user: "1500"
  run_as_group: "1500"

network_policies: {}
